<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock API Payload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/output.css" />
</head>
<body class="payload-page">

  <div class="payload-wrapper">

    <div class="payload-header">
      <div>
        <h1 class="payload-header__title">Mock API Payload</h1>
        <p class="payload-header__meta">
          This is the JSON that would be sent to a ticketing system (e.g. ServiceNow, Jira SM).
          No real request is made.
        </p>
      </div>
      <div style="display:flex; gap: var(--space-3); align-items: flex-start; flex-wrap: wrap;">
        <span class="payload-header__badge">POST /api/v1/tickets</span>
        <button class="payload-copy-btn" id="btn-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          Copy JSON
        </button>
      </div>
    </div>

    <div class="payload-body">
      <pre id="payload-content">Loading…</pre>
    </div>

  </div>

  <script type="module" src="/js/payload.js"></script>
</body>
</html>
